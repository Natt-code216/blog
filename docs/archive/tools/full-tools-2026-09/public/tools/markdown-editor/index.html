<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 转 HTML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050505;
    color: #fcfcfc;
    font-family: 'Inter', sans-serif;
    line-height: 1.7;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
  .back-link {
    color: #888;
    text-decoration: none;
    font-size: 0.9rem;
    display: inline-block;
    margin-bottom: 1.5rem;
    transition: color 0.2s;
  }
  .back-link:hover { color: #fcfcfc; }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
  }
  .subtitle { color: #888; margin-bottom: 2rem; }
  .actions {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  button {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.6rem 1.2rem;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.2s, border-color 0.2s;
  }
  .btn-primary { background: #fcfcfc; color: #050505; border: none; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary {
    background: transparent;
    color: #fcfcfc;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .btn-secondary:hover { border-color: rgba(255,255,255,0.2); }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: #111111;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color 0.2s;
    display: flex;
    flex-direction: column;
  }
  .panel:hover { border-color: rgba(255,255,255,0.2); }
  .panel-label {
    padding: 0.6rem 1rem;
    font-size: 0.8rem;
    color: #555;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  textarea {
    width: 100%;
    min-height: 480px;
    background: #111111;
    color: #fcfcfc;
    border: none;
    padding: 0.75rem 1rem;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.9rem;
    line-height: 1.6;
    resize: vertical;
    outline: none;
    flex: 1;
  }
  .preview {
    padding: 0.75rem 1rem;
    min-height: 480px;
    overflow: auto;
    color: #fcfcfc;
  }
  .preview h1, .preview h2, .preview h3, .preview h4 {
    font-family: 'Playfair Display', serif;
    margin: 1.2rem 0 0.6rem;
    line-height: 1.3;
  }
  .preview h1 { font-size: 1.8rem; }
  .preview h2 { font-size: 1.5rem; }
  .preview h3 { font-size: 1.2rem; }
  .preview p {
    font-family: 'Inter', sans-serif;
    margin: 0.6rem 0;
    color: #fcfcfc;
  }
  .preview a { color: #fcfcfc; text-decoration: underline; }
  .preview ul, .preview ol { margin: 0.6rem 0 0.6rem 1.4rem; }
  .preview li { margin: 0.2rem 0; }
  .preview blockquote {
    border-left: 2px solid rgba(255,255,255,0.2);
    padding-left: 1rem;
    color: #888;
    margin: 0.8rem 0;
  }
  .preview code {
    background: #1a1a1a;
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.88rem;
  }
  .preview pre {
    background: #1a1a1a;
    padding: 0.9rem 1rem;
    border-radius: 4px;
    overflow-x: auto;
    margin: 0.8rem 0;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .preview pre code {
    background: transparent;
    padding: 0;
  }
  .preview hr {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin: 1.2rem 0;
  }
  .preview table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.8rem 0;
  }
  .preview th, .preview td {
    border: 1px solid rgba(255,255,255,0.08);
    padding: 0.5rem 0.75rem;
  }
  .status {
    margin-top: 1rem;
    padding: 0.75rem 1rem;
    border-radius: 4px;
    font-size: 0.9rem;
    display: none;
  }
  .status.error {
    display: block;
    background: rgba(239,104,104,0.08);
    color: #ef6868;
    border: 1px solid rgba(239,104,104,0.2);
  }
  .status.success {
    display: block;
    background: rgba(110,217,154,0.08);
    color: #6ed99a;
    border: 1px solid rgba(110,217,154,0.2);
  }
</style>
</head>
<body>
<div class="container">
  <a href="./index.html" class="back-link">← 返回工具集</a>
  <h1>Markdown 转 HTML</h1>
  <p class="subtitle">实时预览 Markdown，复制或下载安全的 HTML。</p>

  <div class="actions">
    <button class="btn-primary" onclick="copyHTML()">复制 HTML 源码</button>
    <button class="btn-secondary" onclick="downloadHTML()">下载 HTML</button>
    <button class="btn-secondary" onclick="clearAll()">清空</button>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-label">Markdown</div>
      <textarea id="input" spellcheck="false" placeholder="# 标题&#10;&#10;这是一段 **粗体** 文本。"></textarea>
    </div>
    <div class="panel">
      <div class="panel-label">预览</div>
      <div id="preview" class="preview"></div>
    </div>
  </div>

  <div id="status" class="status"></div>
</div>

<script>
  const input = document.getElementById('input');
  const preview = document.getElementById('preview');
  const status = document.getElementById('status');

  function showStatus(msg, type) { status.textContent = msg; status.className = 'status ' + type; }

  function render() {
    const md = input.value;
    const raw = marked.parse(md);
    const clean = DOMPurify.sanitize(raw);
    preview.innerHTML = clean;
  }

  function getHTML() {
    return DOMPurify.sanitize(marked.parse(input.value));
  }

  async function copyHTML() {
    const html = getHTML();
    if (!html.trim()) { showStatus('没有可复制的内容', 'error'); return; }
    try {
      await navigator.clipboard.writeText(html);
      showStatus('已复制 HTML 源码', 'success');
    } catch (e) {
      showStatus('复制失败：' + e.message, 'error');
    }
  }

  function downloadHTML() {
    const html = getHTML();
    if (!html.trim()) { showStatus('没有可下载的内容', 'error'); return; }
    const doc = `<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<title>导出文档</title>\n</head>\n<body>\n${html}\n</body>\n</html>`;
    const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'document.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showStatus('已下载 document.html', 'success');
  }

  function clearAll() {
    input.value = '';
    preview.innerHTML = '';
    status.className = 'status';
  }

  input.addEventListener('input', render);
  input.value = '# 你好世界\n\n这是一段 **Markdown** 示例。\n\n- 列表项一\n- 列表项二\n\n```js\nconst x = 42;\n```\n';
  render();
</script>
</body>
</html>
