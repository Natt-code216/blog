<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>文本字数统计</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:#fcfcfc;font-family:'Inter',sans-serif;line-height:1.7;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:2rem}
.back{color:#888;text-decoration:none;font-size:.9rem;display:inline-block;margin-bottom:2rem}
.back:hover{color:#fcfcfc}
h1{font-family:'Playfair Display',serif;font-size:2.5rem;margin-bottom:.5rem}
.subtitle{color:#888;margin-bottom:2.5rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat{background:#111;border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:1rem 1.25rem;transition:.2s}
.stat:hover{border-color:rgba(255,255,255,.2)}
.stat .lbl{color:#555;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem}
.stat .val{font-family:'Playfair Display',serif;font-size:1.8rem;line-height:1.2}
.card{background:#111;border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:1.5rem}
textarea{width:100%;min-height:300px;background:#111;border:1px solid rgba(255,255,255,.08);border-radius:4px;color:#fcfcfc;padding:1rem;font-family:inherit;font-size:.95rem;line-height:1.7;resize:vertical}
textarea:focus{outline:none;border-color:rgba(255,255,255,.2)}
.actions{display:flex;gap:.75rem;margin-top:1rem;flex-wrap:wrap}
.btn{background:#fcfcfc;color:#050505;border:none;padding:.6rem 1.2rem;border-radius:4px;cursor:pointer;font-family:inherit;font-weight:500}
.btn:hover{opacity:.85}
.btn-sec{background:transparent;color:#fcfcfc;border:1px solid rgba(255,255,255,.08)}
.btn-sec:hover{border-color:rgba(255,255,255,.2)}
.msg{margin-top:.75rem;font-size:.85rem;min-height:1.2rem;color:#6ed99a}
</style>
</head>
<body>
<div class="container">
<a class="back" href="./index.html">← 返回工具集</a>
<h1>文本字数统计</h1>
<p class="subtitle">实时统计字符、中英文、段落与阅读时长。</p>

<div class="stats" id="stats"></div>

<div class="card">
<textarea id="t" placeholder="在此输入或粘贴文本..."></textarea>
<div class="actions">
<button class="btn btn-sec" id="copy">复制文本</button>
<button class="btn btn-sec" id="clear">清空</button>
</div>
<div class="msg" id="msg"></div>
</div>
</div>

<script>
const t=document.getElementById('t'),statsEl=document.getElementById('stats'),msg=document.getElementById('msg');
function analyze(s){
  const charsAll=s.length;
  const charsNoSp=s.replace(/\s/g,'').length;
  const cjk=(s.match(/[一-鿿㐀-䶿]/g)||[]).length;
  const words=(s.match(/[a-zA-Z]+(?:['-][a-zA-Z]+)*/g)||[]).length;
  const lines=s===''?0:s.split(/\r?\n/).length;
  const paras=s.trim()===''?0:s.trim().split(/\n\s*\n/).length;
  const mins=cjk/300+words/200;
  const readT=mins<1?Math.ceil(mins*60)+' 秒':Math.ceil(mins)+' 分钟';
  return{字符数:charsAll,'字符(不含空格)':charsNoSp,中文字数:cjk,英文单词:words,行数:lines,段落数:paras,阅读时长:readT};
}
function render(){
  const r=analyze(t.value);
  statsEl.innerHTML=Object.entries(r).map(([k,v])=>`<div class="stat"><div class="lbl">${k}</div><div class="val">${v}</div></div>`).join('');
}
t.addEventListener('input',render);
document.getElementById('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(t.value);msg.textContent='已复制';setTimeout(()=>msg.textContent='',1500)}
  catch(e){msg.textContent='复制失败'}
};
document.getElementById('clear').onclick=()=>{t.value='';render()};
render();
</script>
</body>
</html>
