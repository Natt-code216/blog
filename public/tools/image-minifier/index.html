<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图片压缩与格式转换</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:#fcfcfc;font-family:'Inter',sans-serif;line-height:1.7;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:2rem}
.back{color:#888;text-decoration:none;font-size:.9rem;display:inline-block;margin-bottom:2rem}
.back:hover{color:#fcfcfc}
h1{font-family:'Playfair Display',serif;font-size:2.5rem;margin-bottom:.5rem}
.subtitle{color:#888;margin-bottom:2.5rem}
.card{background:#111;border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:1.5rem;margin-bottom:1.5rem}
.drop{border:2px dashed rgba(255,255,255,.08);border-radius:6px;padding:3rem;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:rgba(255,255,255,.2)}
.drop p{color:#888}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-top:1.5rem}
.opt label{display:block;color:#888;font-size:.85rem;margin-bottom:.4rem}
.opt select,.opt input{width:100%;background:#111;border:1px solid rgba(255,255,255,.08);border-radius:4px;color:#fcfcfc;padding:.5rem .75rem;font-family:inherit}
.opt input[type=range]{padding:0}
.btn{background:#fcfcfc;color:#050505;border:none;padding:.6rem 1.2rem;border-radius:4px;cursor:pointer;font-family:inherit;font-weight:500}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-sec{background:transparent;color:#fcfcfc;border:1px solid rgba(255,255,255,.08)}
.btn-sec:hover{border-color:rgba(255,255,255,.2);opacity:1}
.actions{display:flex;gap:.75rem;margin-top:1rem;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:1rem;padding:1rem;border:1px solid rgba(255,255,255,.08);border-radius:4px;margin-bottom:.75rem}
.item img{width:60px;height:60px;object-fit:cover;border-radius:4px;background:#050505}
.item-info{flex:1;font-size:.85rem}
.item-info .name{color:#fcfcfc;margin-bottom:.25rem;word-break:break-all}
.item-info .meta{color:#888}
.success{color:#6ed99a}
.error{color:#ef6868}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="container">
<a class="back" href="./index.html">← 返回工具集</a>
<h1>图片压缩与格式转换</h1>
<p class="subtitle">浏览器本地压缩，无需上传服务器。</p>

<div class="card">
<label class="drop" id="drop">
<p>点击或拖放图片到此（支持 JPG / PNG / WebP，多选）</p>
<input type="file" id="file" accept="image/*" multiple>
</label>
<div class="opts">
<div class="opt"><label>输出格式</label>
<select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select>
</div>
<div class="opt"><label>质量 <span id="qv">0.80</span></label>
<input type="range" id="q" min="0.1" max="1" step="0.05" value="0.8">
</div>
<div class="opt"><label>最大宽度 (px，可空)</label>
<input type="number" id="mw" placeholder="不限制">
</div>
</div>
<div class="actions">
<button class="btn" id="run">开始压缩</button>
<button class="btn btn-sec" id="all" disabled>全部下载 (ZIP)</button>
<button class="btn btn-sec" id="clear">清空</button>
</div>
</div>

<div id="list"></div>
</div>

<script>
const drop=document.getElementById('drop'),fileEl=document.getElementById('file'),listEl=document.getElementById('list');
const fmtEl=document.getElementById('fmt'),qEl=document.getElementById('q'),qv=document.getElementById('qv'),mwEl=document.getElementById('mw');
let files=[],results=[];
qEl.oninput=()=>qv.textContent=(+qEl.value).toFixed(2);
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');addFiles(e.dataTransfer.files)});
fileEl.onchange=e=>addFiles(e.target.files);
function addFiles(fl){for(const f of fl)if(f.type.startsWith('image/'))files.push(f);render()}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(2)+' MB'}
function render(){
  listEl.innerHTML='';
  files.forEach((f,i)=>{
    const r=results[i];
    const div=document.createElement('div');div.className='item';
    const url=URL.createObjectURL(f);
    div.innerHTML=`<img src="${url}"><div class="item-info"><div class="name">${f.name}</div><div class="meta" id="m${i}">原始: ${fmtSize(f.size)}${r?` → <span class="success">${fmtSize(r.blob.size)}</span> (节省 ${((1-r.blob.size/f.size)*100).toFixed(1)}%)`:''}</div></div>`;
    const dl=document.createElement('button');dl.className='btn btn-sec';dl.textContent='下载';dl.disabled=!r;
    dl.onclick=()=>{if(r){const a=document.createElement('a');a.href=URL.createObjectURL(r.blob);a.download=r.name;a.click()}};
    div.appendChild(dl);
    const rm=document.createElement('button');rm.className='btn btn-sec';rm.textContent='✕';
    rm.onclick=()=>{files.splice(i,1);results.splice(i,1);render()};
    div.appendChild(rm);
    listEl.appendChild(div);
    const img=new Image();img.src=url;img.onload=()=>{document.getElementById('m'+i).innerHTML=`${img.naturalWidth}×${img.naturalHeight} · ${fmtSize(f.size)}${r?` → <span class="success">${fmtSize(r.blob.size)}</span> (节省 ${((1-r.blob.size/f.size)*100).toFixed(1)}%)`:''}`};
  });
  document.getElementById('all').disabled=!results.length||results.some(r=>!r);
}
async function compress(f){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
  let w=img.naturalWidth,h=img.naturalHeight;
  const mw=parseInt(mwEl.value);
  if(mw&&w>mw){h=h*mw/w;w=mw}
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  const fmt=fmtEl.value,q=+qEl.value;
  const blob=await new Promise(res=>c.toBlob(res,fmt,q));
  const ext=fmt.split('/')[1].replace('jpeg','jpg');
  const name=f.name.replace(/\.[^.]+$/,'')+'_compressed.'+ext;
  return{blob,name};
}
document.getElementById('run').onclick=async()=>{
  results=[];render();
  for(let i=0;i<files.length;i++){try{results[i]=await compress(files[i])}catch(e){results[i]=null}render()}
};
document.getElementById('all').onclick=async()=>{
  const zip=new JSZip();
  results.forEach(r=>r&&zip.file(r.name,r.blob));
  const blob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='images.zip';a.click();
};
document.getElementById('clear').onclick=()=>{files=[];results=[];render()};
</script>
</body>
</html>
