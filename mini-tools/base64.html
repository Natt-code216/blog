<!doctype html>
<html lang="zh-CN" data-theme="light" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="支持文本与文件的 Base64 编码解码，兼容中文。">
  <title>Base64 编解码 · 我的空间</title>
  <meta name="theme-color" content="#f7f8f3" />
  <script src="/theme.js"></script>
  <script type="module" src="/src/features/tools/implementations/base64.js"></script>
</head>
<body>
<main class="container" id="main">
  <a href="./index.html" class="back">← 返回工具集</a>
  <h1>Base64 编解码</h1>
  <p class="subtitle">支持文本与文件的 Base64 编码解码，兼容中文。</p>

<div class="tabs" role="tablist" aria-label="转换类型">
  <button class="tab active" id="text-tab" role="tab" aria-controls="tab-text" aria-selected="true" data-tab="text">文本</button>
  <button class="tab" id="file-tab" role="tab" aria-controls="tab-file" aria-selected="false" tabindex="-1" data-tab="file">文件</button>
</div>
<div id="tab-text" role="tabpanel" aria-labelledby="text-tab">
  <div class="actions"><button class="btn btn-primary" id="encode">编码</button><button class="btn btn-secondary" id="decode">解码</button><button class="btn btn-secondary" id="copy-text">复制结果</button><button class="btn btn-secondary" id="clear-text">清空</button></div>
  <div class="grid editor-grid"><div class="panel"><label class="panel-label" for="text-input">输入文本或 Base64</label><textarea id="text-input" spellcheck="false" placeholder="输入文本或 Base64 字符串"></textarea></div><div class="panel"><label class="panel-label" for="text-output">输出</label><textarea id="text-output" readonly spellcheck="false"></textarea></div></div>
</div>
<div id="tab-file" role="tabpanel" aria-labelledby="file-tab" hidden>
  <div class="card file-panel">
    <h2>文件 → Base64</h2><label for="file-input">选择文件</label><input type="file" id="file-input"><p id="file-info" class="hint"></p>
    <label for="file-output">Base64 输出</label><textarea id="file-output" readonly spellcheck="false" placeholder="选择文件后显示 Base64 字符串"></textarea>
    <div class="actions"><button class="btn btn-secondary" id="copy-file">复制 Base64</button><button class="btn btn-secondary" id="download-text">下载 .txt</button></div>
  </div>
  <div class="card file-panel"><h2>Base64 → 文件</h2><label for="b64-input">Base64 内容</label><textarea id="b64-input" spellcheck="false" placeholder="粘贴 Base64 字符串或 Data URL"></textarea>
    <div class="opts"><div class="opt"><label for="mime-input">MIME 类型</label><input type="text" id="mime-input" value="application/octet-stream"></div><div class="opt"><label for="filename-input">文件名</label><input type="text" id="filename-input" value="decoded.bin"></div></div>
    <div class="actions"><button class="btn btn-primary" id="decode-file">解码并下载</button></div>
  </div>
</div>
<div id="status" class="status" role="status" aria-live="polite"></div>
</main>
</body>
</html>
