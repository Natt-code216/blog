<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在浏览器内按指定顺序合并多个 PDF 文件，无需上传服务器。">
  <title>PDF 合并 · 我的空间</title>
  <meta name="theme-color" content="#f7f8f3" />
  <script src="/theme.js"></script>
  <script type="module" src="/src/features/tools/implementations/pdf-merger.js"></script>
</head>
<body>
<main class="container" id="main">
  <a href="./index.html" class="back">← 返回工具集</a>
  <h1>PDF 合并</h1>
  <p class="subtitle">将多个 PDF 文件按指定顺序合并为一个文件。</p>
  <section class="card" aria-label="选择与排列 PDF 文件">
    <label class="drop" id="drop" for="input">
      <input type="file" id="input" accept="application/pdf,.pdf" multiple aria-describedby="upload-hint">
      <span>点击或拖放 PDF 文件到此处</span>
      <span class="hint" id="upload-hint">至少选择 2 个文件 · 文件仅在本机处理</span>
    </label>
    <ol class="pdf-file-list" id="list" aria-label="合并顺序"></ol>
    <div class="actions">
      <button class="btn btn-primary" id="merge" type="button" disabled>合并并下载</button>
      <button class="btn btn-secondary" id="clear" type="button">清空</button>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </section>
</main>
</body>
</html>
