<!doctype html>
<html lang="zh-CN" data-theme="light" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="格式化、压缩与校验 JSON 数据，发现语法错误。">
  <title>JSON 格式化与校验 · 我的空间</title>
  <meta name="theme-color" content="#f7f8f3" />
  <script src="/theme.js"></script>
  <script type="module" src="/src/features/tools/implementations/json-formatter.js"></script>
</head>
<body>
<main class="container" id="main">
  <a href="./index.html" class="back">← 返回工具集</a>
  <h1>JSON 格式化与校验</h1>
  <p class="subtitle">格式化、压缩与校验 JSON 数据，发现语法错误。</p>

<div class="actions">
  <button class="btn btn-primary" id="format">格式化</button>
  <button class="btn btn-secondary" id="minify">压缩</button>
  <button class="btn btn-secondary" id="validate">校验</button>
  <button class="btn btn-secondary" id="copy">复制结果</button>
  <button class="btn btn-secondary" id="clear">清空</button>
</div>
<div class="grid editor-grid">
  <div class="panel"><label class="panel-label" for="input">输入 JSON</label><textarea id="input" placeholder='{"name": "示例", "value": 42}' spellcheck="false"></textarea></div>
  <div class="panel"><label class="panel-label" for="output">输出</label><textarea id="output" readonly spellcheck="false"></textarea></div>
</div>
<div id="status" class="status" role="status" aria-live="polite"></div>
</main>
</body>
</html>
