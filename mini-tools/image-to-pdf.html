<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在浏览器内将图片转换为 PDF，支持排序、页面方向和边距设置。">
  <title>图片转 PDF · 我的空间</title>
  <meta name="theme-color" content="#f7f8f3" />
  <script src="/theme.js"></script>
  <script type="module" src="/src/features/tools/implementations/image-to-pdf.js"></script>
</head>
<body>
<main class="container" id="main">
  <a href="./index.html" class="back">← 返回工具集</a>
  <h1>图片转 PDF</h1>
  <p class="subtitle">将多张图片合并为一个 PDF 文件，支持页面设置。</p>
  <section class="card" aria-label="图片与页面设置">
    <label class="drop" id="drop" for="input">
      <input type="file" id="input" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple aria-describedby="upload-hint">
      <span>点击或拖放图片到此处</span>
      <span class="hint" id="upload-hint">JPG / PNG / WebP · 支持多选 · 文件仅在本机处理</span>
    </label>
    <div class="opts">
      <div class="opt">
        <label for="size">页面尺寸</label>
        <select id="size"><option value="A4">A4</option><option value="Letter">Letter</option><option value="original">原图大小</option></select>
      </div>
      <div class="opt">
        <label for="orient">方向</label>
        <select id="orient" aria-describedby="size-hint"><option value="portrait">竖向</option><option value="landscape">横向</option></select>
      </div>
      <div class="opt">
        <label for="margin">边距（pt）</label>
        <input type="number" id="margin" value="24" min="0" max="200" step="1" required>
      </div>
    </div>
    <p class="hint" id="size-hint">原图大小保留图片方向；可以用下方箭头调整 PDF 中的页面顺序。</p>
    <div class="image-grid" id="grid" aria-label="已选图片"></div>
    <div class="actions">
      <button class="btn btn-primary" id="gen" type="button" disabled>生成 PDF</button>
      <button class="btn btn-secondary" id="clear" type="button">清空</button>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </section>
</main>
</body>
</html>
