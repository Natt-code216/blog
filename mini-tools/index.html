<!doctype html>
<html lang="zh-CN" data-theme="light" style="color-scheme: light;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="11 个实用小工具，处理 PDF、图片、文本和数据，让琐事简单一点。" />
    <title>实用工具集 · 我的空间</title>
    <meta name="theme-color" content="#f7f8f3" />
    <script src="/theme.js"></script>
    <script type="module" src="/src/features/tools/workbench/directory.ts"></script>
  </head>
  <body>
    <main class="container" id="main">
      <a class="back" href="/#tools">← 返回首页工具区</a>
      <div class="directory-heading">
        <div>
          <p class="directory-kicker">THE EVERYDAY KIT / 11 TOOLS</p>
          <h1>实用工具集</h1>
          <p class="subtitle">把琐事交给工具，把时间留给好奇心。</p>
        </div>
        <p class="directory-note">PDF、图片、文本与数据。<br />在浏览器里，即用即走。</p>
      </div>
      <div class="directory-search">
        <label for="tool-search">找一个顺手的工具</label>
        <input id="tool-search" type="search" placeholder="搜索 PDF、图片、JSON…" autocomplete="off" />
        <p id="result-count" role="status" aria-live="polite"></p>
      </div>
      <div id="tool-groups"></div>
      <p class="directory-empty" id="empty" hidden>没有找到匹配的工具，换一个关键词试试。</p>
      <noscript>请开启 JavaScript 后使用这些工具。</noscript>
    </main>
  </body>
</html>
