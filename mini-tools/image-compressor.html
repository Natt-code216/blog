<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在浏览器本地压缩图片，转换 JPG、PNG、WebP 格式并批量下载。">
  <title>图片压缩与格式转换 · 我的空间</title>
  <meta name="theme-color" content="#f7f8f3" />
  <script src="/theme.js"></script>
  <script type="module" src="/src/features/tools/implementations/image-compressor.js"></script>
</head>
<body>
<main class="container" id="main">
  <a class="back" href="./index.html">← 返回工具集</a>
  <h1>图片压缩与格式转换</h1>
  <p class="subtitle">浏览器本地压缩，无需上传服务器。</p>
  <section class="card" aria-label="选择图片与压缩设置">
    <label class="drop" id="drop" for="file">
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple aria-describedby="upload-hint">
      <span>点击或拖放图片到此处</span>
      <span class="hint" id="upload-hint">JPG / PNG / WebP · 支持多选 · 文件仅在本机处理</span>
    </label>
    <div class="opts">
      <div class="opt">
        <label for="fmt">输出格式</label>
        <select id="fmt" aria-describedby="format-hint"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select>
      </div>
      <div class="opt">
        <label for="q">质量 <output id="qv" for="q">80%</output></label>
        <input type="range" id="q" min="0.1" max="1" step="0.05" value="0.8" aria-describedby="format-hint">
      </div>
      <div class="opt">
        <label for="mw">最大宽度（px，可留空）</label>
        <input type="number" id="mw" min="1" max="16384" step="1" placeholder="保持原图宽度">
      </div>
    </div>
    <p class="hint" id="format-hint">JPG 的透明区域使用白色背景。质量越低，通常文件越小。</p>
    <div class="actions">
      <button class="btn btn-primary" id="run" type="button" disabled>开始压缩</button>
      <button class="btn btn-secondary" id="all" type="button" disabled>下载结果（ZIP）</button>
      <button class="btn btn-secondary" id="clear" type="button">清空</button>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </section>
  <ul class="compression-list" id="list" aria-label="图片与压缩结果"></ul>
</main>
</body>
</html>
