<!doctype html>
<html lang="zh-CN" data-theme="light" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Unix 时间戳与日期时间的双向转换。">
  <title>时间戳转换 · 我的空间</title>
  <meta name="theme-color" content="#f7f8f3" />
  <script src="/theme.js"></script>
  <script type="module" src="/src/features/tools/implementations/timestamp.js"></script>
</head>
<body>
<main class="container" id="main">
  <a href="./index.html" class="back">← 返回工具集</a>
  <h1>时间戳转换</h1>
  <p class="subtitle">Unix 时间戳与日期时间的双向转换。</p>

<div class="card"><h2>当前时间</h2><div class="now-row"><div class="now" id="now">—</div><button class="btn btn-secondary" id="copyNow">复制秒</button><button class="btn btn-secondary" id="copyMs">复制毫秒</button></div><div class="msg" id="nowMsg" role="status" aria-live="polite"></div></div>
<div class="card"><h2>时区</h2><div class="row"><div><label for="tz">选择时区</label><select id="tz"><option value="local">本地（浏览器）</option><option value="0">UTC (+0)</option><option value="custom">自定义偏移</option></select></div><div><label for="off">自定义偏移（-12 ~ +14 小时）</label><input type="number" id="off" min="-12" max="14" step="0.25" value="8" disabled></div></div></div>
<div class="card"><h2>时间戳 → 日期</h2><div class="row timestamp-input"><div><label for="ts">时间戳</label><input type="text" id="ts" inputmode="decimal" placeholder="例如 1700000000"></div><div><label for="unit">单位</label><select id="unit"><option value="auto">自动识别</option><option value="seconds">秒</option><option value="milliseconds">毫秒</option></select></div><button class="btn btn-primary" id="ts2d">转换为日期</button></div><p class="hint">自动识别：绝对值小于 1000 亿按秒处理；历史日期等特殊值请手动选择单位。</p><div class="result" id="ts2dR" role="status" aria-live="polite" hidden></div></div>
<div class="card"><h2>日期 → 时间戳</h2><div class="row"><div><label for="dt">日期时间（按所选时区解读）</label><input type="datetime-local" id="dt" step="1"></div><button class="btn btn-primary" id="d2ts">转换为时间戳</button></div><div class="result" id="d2tsR" role="status" aria-live="polite" hidden></div></div>
</main>
</body>
</html>
