<!doctype html>
<html lang="zh-CN" data-theme="light" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="实时统计字符、中英文、段落与阅读时长。">
  <title>文本字数统计 · 我的空间</title>
  <meta name="theme-color" content="#f7f8f3" />
  <script src="/theme.js"></script>
  <script type="module" src="/src/features/tools/implementations/word-counter.js"></script>
</head>
<body>
<main class="container" id="main">
  <a href="./index.html" class="back">← 返回工具集</a>
  <h1>文本字数统计</h1>
  <p class="subtitle">实时统计字符、中英文、段落与阅读时长。</p>

<div class="stats" id="stats" aria-label="文本统计"></div>
<div class="card"><label for="t">待统计文本</label><textarea id="t" placeholder="在此输入或粘贴文本…"></textarea><p class="hint">字符按 Unicode 码点计数；阅读时长按中文 300 字 / 分钟、英文 200 词 / 分钟估算。</p><div class="actions"><button class="btn btn-secondary" id="copy">复制文本</button><button class="btn btn-secondary" id="clear">清空</button></div><div class="msg" id="msg" role="status" aria-live="polite"></div></div>
</main>
</body>
</html>
