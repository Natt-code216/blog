<!doctype html>
<html lang="zh-CN" data-theme="light" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在 CSV 与 JSON 之间双向转换，支持复制与下载。">
  <title>CSV ↔ JSON 互转 · 我的空间</title>
  <meta name="theme-color" content="#f7f8f3" />
  <script src="/theme.js"></script>
  <script type="module" src="/src/features/tools/implementations/csv-json.js"></script>
</head>
<body>
<main class="container" id="main">
  <a href="./index.html" class="back">← 返回工具集</a>
  <h1>CSV ↔ JSON 互转</h1>
  <p class="subtitle">在 CSV 与 JSON 之间双向转换，支持复制与下载。</p>

<div class="actions">
  <button class="btn btn-primary" id="csv-to-json">CSV → JSON</button>
  <button class="btn btn-secondary" id="json-to-csv">JSON → CSV</button>
  <button class="btn btn-secondary" id="copy">复制结果</button>
  <button class="btn btn-secondary" id="download">下载</button>
  <button class="btn btn-secondary" id="clear">清空</button>
</div>
<div class="grid editor-grid">
  <div class="panel"><label class="panel-label" for="input">输入 CSV 或 JSON</label><textarea id="input" placeholder="name,age&#10;张三,30&#10;李四,25" spellcheck="false"></textarea></div>
  <div class="panel"><label class="panel-label" for="output">输出</label><textarea id="output" readonly spellcheck="false"></textarea></div>
</div>
<p class="hint">CSV 第一行作为字段名；JSON 需为对象数组。嵌套对象会作为 JSON 文本写入 CSV 单元格。</p>
<div id="status" class="status" role="status" aria-live="polite"></div>
</main>
</body>
</html>
