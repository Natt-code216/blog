<!doctype html>
<html lang="zh-CN" data-theme="light" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="输入文本或链接，实时生成可下载的二维码。">
  <title>二维码生成器 · 我的空间</title>
  <meta name="theme-color" content="#f7f8f3" />
  <script src="/theme.js"></script>
  <script type="module" src="/src/features/tools/implementations/qrcode.js"></script>
</head>
<body>
<main class="container" id="main">
  <a href="./index.html" class="back">← 返回工具集</a>
  <h1>二维码生成器</h1>
  <p class="subtitle">输入文本或链接，实时生成可下载的二维码。</p>

<div class="card"><div class="grid qr-grid"><div>
<label for="text">内容</label><textarea id="text" placeholder="输入文本或 URL…">https://example.com</textarea>
<div class="opts-row"><div><label for="size">尺寸</label><select id="size"><option value="128">128 px</option><option value="256" selected>256 px</option><option value="512">512 px</option></select></div><div><label for="lvl">纠错等级</label><select id="lvl"><option>L</option><option selected>M</option><option>Q</option><option>H</option></select></div></div>
<div class="opts-row"><div><label for="fg">前景色</label><input type="color" id="fg" value="#000000"></div><div><label for="bg">背景色</label><input type="color" id="bg" value="#ffffff"></div></div>
<div class="actions"><button class="btn btn-primary" id="dl" disabled>下载 PNG</button><button class="btn btn-secondary" id="cp" disabled>复制图片</button></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
</div><div class="qr-preview"><div class="qr-box"><canvas id="qr" role="img" aria-label="生成的二维码"></canvas><p id="qr-empty" hidden>输入内容后生成二维码</p></div><p class="hint">二维码预览使用你选择的背景色，导出时保持一致。</p></div></div></div>
</main>
</body>
</html>
