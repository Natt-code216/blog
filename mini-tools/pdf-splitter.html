<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在浏览器内按指定页码从 PDF 提取页面并生成新文件。">
  <title>PDF 拆分 · 我的空间</title>
  <meta name="theme-color" content="#f7f8f3" />
  <script src="/theme.js"></script>
  <script type="module" src="/src/features/tools/implementations/pdf-splitter.js"></script>
</head>
<body>
<main class="container" id="main">
  <a href="./index.html" class="back">← 返回工具集</a>
  <h1>PDF 拆分</h1>
  <p class="subtitle">按指定页码范围从 PDF 中提取页面并生成新文件。</p>
  <section class="card" aria-label="选择 PDF 与提取范围">
    <label class="drop" id="drop" for="input">
      <input type="file" id="input" accept="application/pdf,.pdf" aria-describedby="upload-hint">
      <span>点击或拖放单个 PDF 文件到此处</span>
      <span class="hint" id="upload-hint">文件仅在本机处理</span>
    </label>
    <p class="pdf-info" id="info" hidden>文件：<strong id="fname"></strong> · 共 <strong id="fpages"></strong> 页</p>
    <div class="range-field">
      <label for="range">页码范围</label>
      <input type="text" id="range" placeholder="例如：1-3, 5, 7-9" aria-describedby="range-hint" autocomplete="off">
      <p class="hint" id="range-hint">用逗号分隔范围，连续页使用连字符。按填写顺序提取，重复页码会保留。</p>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="split" type="button" disabled>拆分并下载</button>
      <button class="btn btn-secondary" id="clear" type="button">清空</button>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </section>
</main>
</body>
</html>
