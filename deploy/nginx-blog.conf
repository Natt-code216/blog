server {
    listen 80;
    listen [::]:80;
    server_name www.blog.offerready.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/blog-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.blog.offerready.cn;
    ssl_certificate /etc/letsencrypt/live/www.blog.offerready.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.blog.offerready.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/blog/current/frontend;
    index index.html;
    client_max_body_size 50m;
    server_tokens off;

    location = /cms { return 301 /cms/; }
    location /cms/ {
        proxy_pass http://127.0.0.1:1337/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cookie_path /admin /cms/admin;
        proxy_read_timeout 120s;
    }
    location /uploads/ {
        alias /opt/blog/shared/uploads/;
        add_header X-Content-Type-Options nosniff;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /mini-tools/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
