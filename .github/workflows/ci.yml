name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check script (if defined)
        run: |
          if pnpm run | grep -qE '^  check( |$)'; then
            pnpm run check
          else
            echo "No 'check' script defined, skipping."
          fi
        shell: bash

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Run tests (if defined)
        run: |
          if pnpm run | grep -qE '^  test:run( |$)'; then
            pnpm run test:run
          else
            echo "No 'test:run' script defined, skipping."
          fi
        shell: bash
